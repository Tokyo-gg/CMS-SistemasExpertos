<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-base" content="/api">
  <meta name="theme-color" content="#0D9488">
  <meta name="description" content="Punto: una plataforma para crear tu blog, compartir ideas y descubrir nuevas perspectivas.">
  <title>Blog · Punto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/blogs.js"></script>
</head>
<body data-page="blog">
  <a href="#main-content" class="skip-link">Saltar al contenido</a>

  <header class="site-header">
    <nav class="navbar navbar-expand-xl container" aria-label="Navegación principal">
      <a class="navbar-brand brand" href="index.html">punto<span aria-hidden="true">.</span><span class="visually-hidden"> Inicio</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="main-nav" class="collapse navbar-collapse">
        <a class="nav-link mx-xl-4" href="index.html">Explorar</a>
        <div id="nav-private" class="private-nav" hidden>
          <a class="nav-link" href="dashboard.html">Mi escritorio</a>
          <a class="nav-link" href="my-posts.html">Publicaciones</a>
          <a class="nav-link" href="blog-settings.html">Mi blog</a>
          <a id="admin-link" class="nav-link" href="admin.html" hidden>Administración</a>
        </div>
        <div id="nav-account" class="account-nav ms-xl-auto">
          <span class="small text-secondary">Comprobando sesión…</span>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" class="container main-content" tabindex="-1">
    <noscript>
      <div class="alert alert-warning">Activa JavaScript para cargar las publicaciones y utilizar tu cuenta.</div>
    </noscript>

    <div id="page-status" class="page-status" aria-live="polite"></div>

    <section class="blog-heading panel">
      <img id="blog-cover" class="blog-cover" alt="" hidden>
      <div class="blog-identity">
        <img id="blog-logo" class="blog-logo mb-3" alt="Logotipo del blog" hidden>
        <span class="eyebrow">UN ESPACIO, MUCHAS IDEAS</span>
        <h1 id="blog-title">Blog del autor</h1>
        <p id="blog-description" class="lead text-secondary"></p>
        <div class="author-note">
          <img id="blog-avatar" class="author-avatar me-3" alt="Fotografía del autor" hidden>
          <strong id="blog-author"></strong>
          <p id="blog-bio" class="text-secondary mb-0"></p>
        </div>
      </div>
    </section>

    <section class="mt-5" aria-labelledby="blog-posts-title">
      <div class="section-heading">
        <h2 id="blog-posts-title">Últimas publicaciones</h2>
        <a class="text-link" href="index.html">
          Explorar otros blogs <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </a>
      </div>
      <div id="blog-posts" aria-live="polite"></div>
      <nav id="pagination" class="pagination-bar" aria-label="Páginas de resultados"></nav>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="brand" href="index.html">punto<span aria-hidden="true">.</span></a>
      <span class="small text-secondary">Un espacio para ideas que merecen ser compartidas.</span>
      <a href="index.html" class="small text-link">Explorar lecturas</a>
    </div>
    <p id="session-info" class="container small text-secondary mt-2 mb-0" role="status"></p>
  </footer>

  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="confirm-title" aria-describedby="confirm-message" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="confirm-title">Confirmar acción</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="confirm-message" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="confirm-ok" class="btn btn-danger">Confirmar</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
